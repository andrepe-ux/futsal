<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Futsal - Database</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        #futsalCanvas {
            border: 3px solid #374151;
            cursor: grab;
            touch-action: none; 
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }
        #futsalCanvas:active {
            cursor: grabbing;
        }
        .recording-active {
            animation: pulse-red 1.5s infinite;
        }
        @keyframes pulse-red {
            0%, 100% { background-color: #ef4444; }
            50% { background-color: #dc2626; }
        }
        .canvas-container {
            max-width: 100%; 
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .cursor-grab { cursor: grab; }
        .cursor-grabbing { cursor: grabbing; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen flex flex-col items-center justify-center p-4" style="font-family: 'Inter', sans-serif;">

    <div id="app" class="w-full max-w-7xl bg-white shadow-2xl rounded-xl p-6 md:p-8 border border-gray-200">
        <h1 class="text-3xl font-bold mb-4 text-teal-600 text-center">FutSalPro - AP</h1>
        <p class="text-center mb-6 text-gray-500">Gestão de Jogadas Dínamo Sanjoanense.</p>

        <!-- Informações e estado da aplicação -->
        <div id="appStatus" class="text-sm text-center mb-4 p-2 bg-teal-100 text-teal-800 rounded-lg font-semibold">
            Comunicação com a DB: OK
        </div>
        
        <!-- Botões de Toggle Universais -->
        <div class="mb-4 flex gap-4">
            <button id="menuToggleLeftBtn" class="w-1/2 lg:w-auto py-3 px-4 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl shadow-md transition duration-150 flex items-center justify-center">
                <svg id="menuIconLeft" class="w-5 h-5 mr-2 transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
                <span id="menuTextLeft">Controlo</span>
            </button>
            <button id="menuToggleRightBtn" class="w-1/2 lg:w-auto py-3 px-4 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl shadow-md transition duration-150 flex items-center justify-center">
                <svg id="menuIconRight" class="w-5 h-5 mr-2 transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2v-2m0 2a2 2 0 100-4 2 2 0 000 4zm-7 7a7 7 0 1014 0 7 7 0 00-14 0z"></path></svg>
                <span id="menuTextRight">Jogadores</span>
            </button>
        </div>

        <!-- Estrutura Principal -->
        <div id="mainLayout" class="flex flex-col lg:flex-row gap-6 w-full">
            
            <!-- Painel de Controlo (Esquerda) -->
            <div id="menuPanelLeft" class="hidden w-full lg:w-1/4 space-y-4 order-1 lg:order-1 flex-shrink-0">
                
                <!-- Opções de Campo -->
                <div class="p-4 bg-gray-100 rounded-xl shadow-inner border border-gray-200">
                    <h2 class="text-xl font-semibold mb-3 border-b border-gray-300 pb-2 text-teal-600">Opções de Campo</h2>
                    <div class="flex flex-col space-y-2">
                        <button id="resetBtn" class="w-full py-2 px-4 bg-yellow-500 hover:bg-yellow-600 text-white rounded-lg font-bold transition duration-150 shadow-md">
                            🔄 Nova Jogada (Reset)
                        </button>
                        <button id="toggleOpponentBtn" class="w-full py-2 px-4 bg-green-600 hover:bg-green-700 text-white rounded-lg font-bold transition duration-150 shadow-md">
                            Mostrar Equipa Oponente
                        </button>
                        <button id="togglePathArrowsBtn" class="w-full py-2 px-4 bg-purple-500 hover:bg-purple-600 text-white rounded-lg font-bold transition duration-150 shadow-md">
                            ✖️ Ocultar Setas de Movimento
                        </button>
                    </div>
                </div>

                <!-- Controlo de Gravação & Criar Jogada -->
                <div class="p-4 bg-gray-100 rounded-xl shadow-inner border border-gray-200">
                    <h2 class="text-xl font-semibold mb-3 border-b border-gray-300 pb-2 text-teal-600">Gravação & Operações BD</h2>
                    
                    <!-- Seletor de Jogadas Gravadas -->
                    <div class="mb-4">
                        <label for="dbPlaySelect" class="block text-xs font-bold text-gray-700 uppercase mb-1">Carregar Jogada da BD:</label>
                        <select id="dbPlaySelect" class="w-full p-2 bg-white border border-teal-500 rounded-lg text-sm font-semibold text-gray-800 focus:ring-teal-500 shadow-sm">
                            <option value="">-- Selecionar Jogada --</option>
                        </select>
                    </div>

                    <div class="flex gap-2 mb-4">
                        <button id="recordBtn" class="w-1/2 py-2 px-4 bg-red-500 hover:bg-red-600 text-white rounded-lg font-bold transition duration-150 disabled:opacity-50 shadow-md">
                            <span id="recordText">Gravar Movimento</span>

                        <button id="playbackBtn" class="w-1/2 py-2 px-4 bg-blue-500 hover:bg-blue-600 text-white rounded-lg font-bold transition duration-150 disabled:opacity-50 shadow-md" disabled>
                            Play
                        </button>
                    </div>
                    
                    <button id="undoBtn" class="w-full py-2 px-4 mb-3 bg-gray-500 hover:bg-gray-600 text-white rounded-lg font-bold transition duration-150 disabled:opacity-50 shadow-md" disabled>

                    <!-- Contentor de Criar/Editar Jogadas -->

                        <!-- Seletor de Tipo de Jogada -->
                        <div>
                            <label for="playTypeSelect" class="block text-xs font-bold text-gray-600 uppercase mb-1">Tipo de Jogada:</label>
                            <select id="playTypeSelect" class="w-full p-2 bg-white border border-gray-300 rounded-lg text-sm font-medium text-gray-800 focus:ring-teal-500 shadow-sm">
                            </select>

                        <!-- Seletor de SubTipo de Jogada -->
                        <div>

                        </div>
                        
                        <!-- Criar Novo Tipo / SubTipo Personalizado -->

                            <input type="text" id="newSubtypeInput" placeholder="Novo SubTipo" class="w-full p-1 bg-white border border-gray-300 rounded text-xs text-gray-800 shadow-sm">
                            <button id="addNewCategoryBtn" class="w-full py-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded text-xs font-bold transition shadow-sm">
                                Adicionar aos Seletores

                        </div>

                        <input type="text" id="playResponsavelInput" placeholder="Responsável" class="w-full p-2 bg-white border border-gray-300 rounded-lg text-sm text-gray-800 focus:ring-teal-500 shadow-sm" value="Treinador">
                    </div>

                    <div class="flex gap-2">
                        <button id="saveBtn" class="w-full py-2 px-4 bg-teal-600 hover:bg-teal-700 text-white rounded-lg font-bold transition duration-150 disabled:opacity-50 shadow-md" disabled>
                            💾 Guardar Jogada
                        </button>
                        <button id="cancelEditBtn" class="hidden py-2 px-3 bg-gray-400 hover:bg-gray-500 text-white rounded-lg font-bold transition duration-150 shadow-md text-xs">
                            Cancelar Edição

                    <p id="statusMessage" class="mt-3 text-center text-sm font-semibold text-teal-600"></p>
                </div>

                <!-- Jogadas Guardadas (Supabase) -->
                <div class="p-4 bg-gray-100 rounded-xl shadow-inner border border-gray-200">
                    <div class="flex justify-between items-center mb-3 border-b border-gray-300 pb-2">
                        <h2 class="text-xl font-semibold text-teal-600">Jogadas na BD</h2>
                        <button id="refreshPlaysBtn" class="text-xs px-2 py-1 bg-teal-500 hover:bg-teal-600 text-white rounded font-bold">Atualizar</button>
                    </div>
                    <div id="savedPlaysList" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                        <p class="text-gray-500 text-sm">A carregar jogadas...</p>
                    </div>
                </div>
            </div>

            <!-- Campo (Canvas) -->
            <div id="canvasWrapper" class="w-full canvas-container bg-gray-200 rounded-xl p-4 shadow-inner order-2 lg:order-2 flex-grow">
                <canvas id="futsalCanvas" width="700" height="933" class="rounded-lg max-w-full h-auto"></canvas>
            </div>

            <!-- Painel de Jogadores (Direita) -->
            <div id="menuPanelRight" class="hidden w-full lg:w-1/4 space-y-4 order-3 lg:order-3 flex-shrink-0">
                <div class="p-4 bg-gray-100 rounded-xl shadow-inner border border-gray-200">
                    <h2 class="text-xl font-semibold mb-3 border-b border-gray-300 pb-2 text-purple-600">Números e Posições</h2>
                    <div id="playerLabelInputs" class="space-y-2">
                        <p class="text-gray-500 text-sm">Carregando inputs...</p>
                    </div>
                </div>
            </div>

        </div>
    </div>
    
    <footer class="mt-8 text-center text-gray-500 text-sm w-full max-w-7xl">
        andrepe@2026
    </footer>

    <!-- Custom Modal -->
    <div id="customModal" class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-xl p-6 shadow-2xl w-full max-w-sm border border-teal-600 text-gray-900">
            <h3 id="modalTitle" class="text-xl font-bold mb-4 text-teal-600"></h3>
            <p id="modalMessage" class="text-gray-700 mb-6"></p>
            <div class="flex justify-end gap-3">
                <button id="modalCancel" class="px-4 py-2 bg-gray-300 text-gray-800 rounded-lg hover:bg-gray-400 transition hidden">Cancelar</button>
                <button id="modalConfirm" class="px-4 py-2 bg-teal-600 text-white rounded-lg hover:bg-teal-700 font-semibold transition">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- Script Principal -->
    <script type="module">
        // --- Configuração Supabase ---
        const SUPABASE_URL = 'https://kgruabdgyisqxsnubrwx.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_XRSBv2LJMfft-LqGZCynBw_9LrKeTvB';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Mapeamento hierárquico base de Tipos e SubTipos (dinamicamente expansível)
        let SUBTIPOS_MAP = {
            'Ataque': ['1*3*1', '1*4*0', '1*2*2'],
            'Defesa': ['Individual', 'Zona', 'Mista'],
            'Transições': ['Ofensiva', 'Defensiva'],
            'Esquemas Táticos': ['Cantos', 'Lançamentos', 'Livres', '5*4', '4*3', 'Bola de Saída', 'Reposição de GR']
        };

        // --- Constantes da Aplicação ---
        const PLAYER_COUNT = 5; 
        const OPPONENT_COUNT = 5; 
        const BALL_ID = 11; 
        const ORIGINAL_PLAYER_RADIUS = 18;
        const SCALE_FACTOR = 700 / 600; 
        const PLAYER_RADIUS = ORIGINAL_PLAYER_RADIUS * SCALE_FACTOR; 
        const BALL_RADIUS = 15 * SCALE_FACTOR; 
        const FRAME_RATE = 100;
        const TRAIL_LENGTH = 15; 
        const LOGO_URL = 'https://placehold.co/150x300/9CA3AF/FFFFFF?text=FutSalPro'; 
        const TEAM_COLOR = '#f87171'; 
        const OPPONENT_COLOR = '#10b981'; 
        const PATH_COLOR = 'rgba(255, 255, 255, 0.6)';

        // Referências ao DOM
        const canvas = document.getElementById('futsalCanvas');
        const ctx = canvas.getContext('2d');
        const recordBtn = document.getElementById('recordBtn');
        const recordText = document.getElementById('recordText');
        const playbackBtn = document.getElementById('playbackBtn');
        const saveBtn = document.getElementById('saveBtn');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        const refreshPlaysBtn = document.getElementById('refreshPlaysBtn');
        const dbPlaySelect = document.getElementById('dbPlaySelect');
        const playNameInput = document.getElementById('playNameInput');
        const playTypeSelect = document.getElementById('playTypeSelect');
        const playSubtypeSelect = document.getElementById('playSubtypeSelect');
        const newTypeInput = document.getElementById('newTypeInput');
        const newSubtypeInput = document.getElementById('newSubtypeInput');
        const addNewCategoryBtn = document.getElementById('addNewCategoryBtn');
        const playResponsavelInput = document.getElementById('playResponsavelInput');
        const toggleOpponentBtn = document.getElementById('toggleOpponentBtn'); 
        const resetBtn = document.getElementById('resetBtn'); 
        const undoBtn = document.getElementById('undoBtn'); 
        const togglePathArrowsBtn = document.getElementById('togglePathArrowsBtn'); 
        
        const editingBadge = document.getElementById('editingBadge');
        const currentPlayIdSpan = document.getElementById('currentPlayId');

        const menuPanelLeft = document.getElementById('menuPanelLeft');
        const menuPanelRight = document.getElementById('menuPanelRight');
        const menuToggleLeftBtn = document.getElementById('menuToggleLeftBtn');
        const menuToggleRightBtn = document.getElementById('menuToggleRightBtn');
        const menuTextLeft = document.getElementById('menuTextLeft');
        const menuTextRight = document.getElementById('menuTextRight');
        const menuIconLeft = document.getElementById('menuIconLeft');
        const menuIconRight = document.getElementById('menuIconRight');
        const canvasWrapper = document.getElementById('canvasWrapper');

        const CANVAS_WIDTH = canvas.width;
        const CANVAS_HEIGHT = canvas.height; 

        let logoImage = new Image();
        let isLogoLoaded = false;
        logoImage.onload = () => { isLogoLoaded = true; updateCanvas(); };
        logoImage.src = LOGO_URL; 

        let initialPositions = []; 

        let state = {
            activePlayId: null,
            plays: [], 
            players: [], 
            ball: {}, 
            playerLabels: {},
            recording: [],
            isRecording: false,
            isPlaying: false,
            playHead: 0,
            interval: null,
            draggedItem: null,
            isMenuLeftOpen: false,
            isMenuRightOpen: false,
            showOpponent: false,
            showPathArrows: true, 
            history: [],
            playerTrails: {} 
        };

        // --- Layout Responsivo ---
        function updateLayout() {
            menuPanelLeft.classList.toggle('hidden', !state.isMenuLeftOpen);
            menuPanelRight.classList.toggle('hidden', !state.isMenuRightOpen);

            menuTextLeft.textContent = state.isMenuLeftOpen ? 'Ocultar Controlo' : 'Controlo';
            menuIconLeft.classList.toggle('rotate-90', state.isMenuLeftOpen);
            menuTextRight.textContent = state.isMenuRightOpen ? 'Ocultar Jogadores' : 'Jogadores';
            menuIconRight.classList.toggle('rotate-90', state.isMenuRightOpen);

            if (window.innerWidth < 1024) {
                canvasWrapper.classList.remove('lg:w-3/4', 'lg:w-2/4'); 
                canvasWrapper.classList.add('w-full'); 
                return;
            }

            let openPanels = (state.isMenuLeftOpen ? 1 : 0) + (state.isMenuRightOpen ? 1 : 0);
            canvasWrapper.classList.remove('lg:w-full', 'lg:w-3/4', 'lg:w-2/4');

            if (openPanels === 0) canvasWrapper.classList.add('lg:w-full');
            else if (openPanels === 1) canvasWrapper.classList.add('lg:w-3/4'); 
            else canvasWrapper.classList.add('lg:w-2/4'); 
        }
        
        function toggleMenu(panelName) {
            if (panelName === 'left') {
                state.isMenuLeftOpen = !state.isMenuLeftOpen;
                if (window.innerWidth < 1024 && state.isMenuLeftOpen) state.isMenuRightOpen = false;
            } else if (panelName === 'right') {
                state.isMenuRightOpen = !state.isMenuRightOpen;
                if (window.innerWidth < 1024 && state.isMenuRightOpen) state.isMenuLeftOpen = false;
            }
            updateLayout(); 
        }

        // --- UI Auxiliar ---
        function showCustomModal(title, message, isConfirm = false) {
            return new Promise(resolve => {
                const modal = document.getElementById('customModal');
                document.getElementById('modalTitle').textContent = title;
                document.getElementById('modalMessage').textContent = message;
                const confirmBtn = document.getElementById('modalConfirm');
                const cancelBtn = document.getElementById('modalCancel');

                confirmBtn.onclick = () => { modal.classList.add('hidden'); resolve(true); };
                if (isConfirm) {
                    cancelBtn.classList.remove('hidden');
                    cancelBtn.onclick = () => { modal.classList.add('hidden'); resolve(false); };
                } else {
                    cancelBtn.classList.add('hidden');
                }
                modal.classList.remove('hidden');
            });
        }
        
        function setStatus(message, isError = false) {
            const el = document.getElementById('statusMessage');
            el.textContent = message;
            el.className = `mt-3 text-center text-sm font-semibold transition-all ${isError ? 'text-red-500' : 'text-teal-600'}`;
            clearTimeout(el.timer);
            el.timer = setTimeout(() => { el.textContent = ''; }, 8000); 
        }

        // --- Desenho no Canvas ---
        function drawCourt() {
            ctx.fillStyle = '#A1887F'; 
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            
            ctx.strokeStyle = '#8D6E63'; 
            ctx.lineWidth = 0.5;
            const plankHeight = 40 * SCALE_FACTOR; 
            for (let y = 0; y < CANVAS_HEIGHT; y += plankHeight) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(CANVAS_WIDTH, y);
                ctx.stroke();
            }
            
            if (isLogoLoaded) {
                const logoSize = 100 * SCALE_FACTOR; 
                ctx.globalAlpha = 0.1; 
                ctx.drawImage(logoImage, CANVAS_WIDTH / 2 - logoSize / 2, CANVAS_HEIGHT / 8 - logoSize / 2, logoSize, logoSize);
                ctx.drawImage(logoImage, CANVAS_WIDTH / 2 - logoSize / 2, CANVAS_HEIGHT * 7 / 8 - logoSize / 2, logoSize, logoSize);
                ctx.globalAlpha = 1.0; 
            }

            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2 * SCALE_FACTOR;
            ctx.strokeRect(1, 1, CANVAS_WIDTH - 2, CANVAS_HEIGHT - 2);
            
            ctx.beginPath();
            ctx.moveTo(0, CANVAS_HEIGHT / 2);
            ctx.lineTo(CANVAS_WIDTH, CANVAS_HEIGHT / 2);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.arc(CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2, 50 * SCALE_FACTOR, 0, Math.PI * 2, false);
            ctx.stroke();
            
            const areaRadius = 80 * SCALE_FACTOR;
            ctx.beginPath();
            ctx.arc(CANVAS_WIDTH / 2, 0, areaRadius, 0, Math.PI, false); 
            ctx.stroke();
            
            ctx.beginPath();
            ctx.arc(CANVAS_WIDTH / 2, CANVAS_HEIGHT, areaRadius, Math.PI, 0, false); 
            ctx.stroke();
            
            ctx.fillStyle = 'white';
            ctx.beginPath(); 
            ctx.arc(CANVAS_WIDTH / 2, 100 * SCALE_FACTOR, 3, 0, Math.PI * 2, false); 
            ctx.fill();
            
            ctx.beginPath(); 
            ctx.arc(CANVAS_WIDTH / 2, CANVAS_HEIGHT - 100 * SCALE_FACTOR, 3, 0, Math.PI * 2, false); 
            ctx.fill();
        }

        function drawArrowHead(x, y, x_prev, y_prev, color) {
            const headLength = 10 * SCALE_FACTOR;
            const angle = Math.atan2(y - y_prev, x - x_prev);
            const offset = PLAYER_RADIUS * 0.6; 
            const endX = x - Math.cos(angle) * offset;
            const endY = y - Math.sin(angle) * offset;

            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(endX, endY);
            ctx.lineTo(endX - headLength * Math.cos(angle - Math.PI / 6), endY - headLength * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(endX - headLength * Math.cos(angle + Math.PI / 6), endY - headLength * Math.sin(angle + Math.PI / 6));
            ctx.closePath();
            ctx.fill();
        }

        function drawPlayerPaths() {
            if (!state.showPathArrows) return;
            let tracksToDraw = {};

            if (state.isPlaying) {
                const framesToShow = state.playHead > state.recording.length ? state.recording.length : state.playHead;
                for (let i = 0; i < framesToShow; i++) {
                    const frame = state.recording[i];
                    frame.positions.forEach(pos => {
                        if (!tracksToDraw[pos.id]) tracksToDraw[pos.id] = [];
                        tracksToDraw[pos.id].push({ x: pos.x, y: pos.y });
                    });
                }
            } else {
                if (state.recording.length > 0) {
                     state.recording.forEach(frame => {
                        frame.positions.forEach(pos => {
                            if (!tracksToDraw[pos.id]) tracksToDraw[pos.id] = [];
                            tracksToDraw[pos.id].push({ x: pos.x, y: pos.y });
                        });
                    });
                }
                Object.keys(state.playerTrails).forEach(id => {
                    const idInt = parseInt(id);
                    if (!tracksToDraw[idInt]) tracksToDraw[idInt] = [];
                    tracksToDraw[idInt] = tracksToDraw[idInt].slice(0, tracksToDraw[idInt].length - TRAIL_LENGTH).concat(state.playerTrails[id]);
                });
            }

            Object.keys(tracksToDraw).forEach(idKey => {
                const id = parseInt(idKey);
                const track = tracksToDraw[idKey];
                if (id === BALL_ID) return; 
                
                const isOpponent = id >= 6 && id <= 10;
                if (isOpponent && !state.showOpponent) return;
                
                const pathColor = isOpponent ? OPPONENT_COLOR : TEAM_COLOR;

                if (track && track.length > 0) {
                    for (let i = 0; i < track.length - 1; i++) {
                        ctx.beginPath();
                        if (!state.isPlaying && i >= track.length - TRAIL_LENGTH - 1) {
                           ctx.setLineDash([]); 
                           ctx.lineWidth = 3;
                           ctx.strokeStyle = pathColor; 
                        } else {
                           ctx.setLineDash([5, 5]); 
                           ctx.lineWidth = 2;
                           ctx.strokeStyle = PATH_COLOR;
                        }
                        ctx.moveTo(track[i].x, track[i].y);
                        ctx.lineTo(track[i+1].x, track[i+1].y);
                        ctx.stroke();
                    }
                    if (track.length > 1) {
                        const lastPoint = track[track.length - 1];
                        const secondLastPoint = track[track.length - 2];
                        ctx.setLineDash([]); 
                        ctx.lineWidth = 2; 
                        drawArrowHead(lastPoint.x, lastPoint.y, secondLastPoint.x, secondLastPoint.y, pathColor);
                    }
                }
            });

            ctx.setLineDash([]); 
            ctx.lineWidth = 2; 
        }

        function drawPlayers() {
            ctx.fillStyle = 'white'; 
            ctx.beginPath();
            ctx.arc(state.ball.x, state.ball.y, BALL_RADIUS, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#374151';
            ctx.lineWidth = 1;
            ctx.stroke();

            const playersToDraw = state.players.filter(p => p.id !== BALL_ID);
            playersToDraw.forEach(p => {
                let isOpponent = p.id >= 6 && p.id <= 10; 
                if (isOpponent && !state.showOpponent) return; 

                ctx.fillStyle = isOpponent ? OPPONENT_COLOR : TEAM_COLOR;
                ctx.beginPath();
                ctx.arc(p.x, p.y, PLAYER_RADIUS, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#374151';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.fillStyle = 'white';
                ctx.font = `${12 * SCALE_FACTOR}px Inter`; 
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const label = state.playerLabels[p.id] || (isOpponent ? 'A'+(p.id-PLAYER_COUNT) : p.id); 
                ctx.fillText(label, p.x, p.y);
            });
        }

        function updateCanvas() {
            drawCourt();
            drawPlayerPaths(); 
            drawPlayers();
            undoBtn.disabled = state.history.length === 0 || state.isRecording || state.isPlaying;
        }

        function getInitialPlayerPositions() {
            const X_CENTER = CANVAS_WIDTH / 2;
            const Y_CENTER = CANVAS_HEIGHT / 2;
            const Y_GOAL_LINE = 50 * SCALE_FACTOR; 
            const Y_FIXO = 180 * SCALE_FACTOR; 
            const Y_ALA = 350 * SCALE_FACTOR; 
            const Y_PIVO = 550 * SCALE_FACTOR; 
            const X_ALA = CANVAS_WIDTH / 4;

            const teamPlayers = [
                { id: 1, x: X_CENTER, y: CANVAS_HEIGHT - Y_GOAL_LINE, label: 'G.R.' }, 
                { id: 2, x: X_CENTER, y: CANVAS_HEIGHT - Y_FIXO, label: 'Fixo' }, 
                { id: 3, x: X_ALA, y: CANVAS_HEIGHT - Y_ALA, label: 'Ala D' },
                { id: 4, x: 3 * X_ALA, y: CANVAS_HEIGHT - Y_ALA, label: 'Ala E' },
                { id: 5, x: X_CENTER, y: CANVAS_HEIGHT - Y_PIVO, label: 'Pivô' }
            ];

            const opponentPlayers = [
                { id: 6, x: X_CENTER, y: Y_GOAL_LINE, label: 'GR A' }, 
                { id: 7, x: X_CENTER, y: Y_FIXO, label: 'Pivô A' }, 
                { id: 8, x: X_ALA, y: Y_ALA, label: 'Ala E A' },
                { id: 9, x: 3 * X_ALA, y: Y_ALA, label: 'Ala D A' },
                { id: 10, x: X_CENTER, y: Y_PIVO, label: 'Fixo A' }
            ];
            
            const ball = { id: BALL_ID, x: X_CENTER, y: Y_CENTER, label: 'Bola' };
            return [...teamPlayers, ...opponentPlayers, ball];
        }

        function clearPlayerTrails() { state.playerTrails = {}; }

        function initializeState() {
            initialPositions = getInitialPlayerPositions();
            state.players = JSON.parse(JSON.stringify(initialPositions));
            state.ball = state.players.find(p => p.id === BALL_ID);
            clearPlayerTrails(); 

            initialPositions.forEach(p => {
                if (!state.playerLabels[p.id]) state.playerLabels[p.id] = p.label;
            });

            renderPlayerLabelInputs();
            updateCanvas();
        }

        function resetPlayersToInitialState() {
            if (state.isPlaying || state.isRecording) {
                showCustomModal('Atenção', 'Pare a reprodução ou gravação antes de iniciar uma nova jogada.', false);
                return;
            }
            state.players = JSON.parse(JSON.stringify(initialPositions));
            state.ball = state.players.find(p => p.id === BALL_ID);
            state.history = [];
            state.recording = [];
            state.playHead = 0; 
            clearPlayerTrails(); 
            playbackBtn.disabled = true;
            saveBtn.disabled = true;
            recordBtn.disabled = false;
            
            clearEditState();
            playNameInput.value = 'Nova Jogada';
            updateCanvas();
            setStatus('Nova Jogada iniciada. Posições restauradas.');
        }

        function saveToHistory() {
            const currentPositions = state.players.map(p => ({ id: p.id, x: p.x, y: p.y }));
            state.history.push(currentPositions);
            if (state.history.length > 50) state.history.shift(); 
        }

        function undoLastMove() {
            if (state.isRecording || state.isPlaying) return;
            if (state.history.length > 0) {
                const previousPositions = state.history.pop();
                previousPositions.forEach(pos => {
                    let item = state.players.find(p => p.id === pos.id);
                    if (item) { item.x = pos.x; item.y = pos.y; }
                });
                clearPlayerTrails(); 
                updateCanvas();
                setStatus('Último movimento desfeito.');
            } else {
                setStatus('Não há mais movimentos para desfazer.', true);
            }
        }

        function togglePathArrowsVisibility() {
            state.showPathArrows = !state.showPathArrows;
            togglePathArrowsBtn.textContent = state.showPathArrows ? '✖️ Ocultar Setas de Movimento' : '▶️ Mostrar Setas de Movimento';
            updateCanvas();
        }

        function renderPlayerLabelInputs() {
            const container = document.getElementById('playerLabelInputs');
            container.innerHTML = '';
            
            const teamTitle = document.createElement('h3');
            teamTitle.className = "text-md font-semibold mt-1 mb-2 text-red-600";
            teamTitle.textContent = "Equipa Principal (Vermelho)";
            container.appendChild(teamTitle);

            for (let i = 1; i <= PLAYER_COUNT; i++) {
                const div = document.createElement('div');
                div.className = "flex items-center gap-2";

                const input = document.createElement('input');
                input.type = 'text';
                input.value = state.playerLabels[i] || i.toString(); 
                input.className = "flex-grow p-1 bg-white border border-gray-300 rounded-lg text-xs text-gray-800 shadow-sm";
                input.onchange = (e) => {
                    state.playerLabels[i] = e.target.value.trim() || i.toString();
                    updateCanvas();
                };

            container.appendChild(opponentTitle);

            for (let i = PLAYER_COUNT + 1; i <= PLAYER_COUNT + OPPONENT_COUNT; i++) {

                colorDiv.className = `w-4 h-4 rounded-full bg-green-600 shadow-sm flex-shrink-0`;
                const input = document.createElement('input');
                input.type = 'text';
                input.value = state.playerLabels[i] || `A ${i-PLAYER_COUNT}`; 
                input.className = "flex-grow p-1 bg-white border border-gray-300 rounded-lg text-xs text-gray-800 shadow-sm";

                    updateCanvas();

        function toggleOpponentVisibility() {
            state.showOpponent = !state.showOpponent;
            toggleOpponentBtn.textContent = state.showOpponent ? 'Ocultar Equipa Oponente' : 'Mostrar Equipa Oponente';
            updateCanvas();
        }

        // --- Drag & Drop ---
        function getClickedItem(x, y) {
            if (Math.hypot(x - state.ball.x, y - state.ball.y) < BALL_RADIUS) return state.ball;
            for (let i = 0; i < state.players.length; i++) {
                const player = state.players[i];
                if (player.id !== BALL_ID) {
                    if (player.id >= 6 && player.id <= 10 && !state.showOpponent) continue; 
                    if (Math.hypot(x - player.x, y - player.y) < PLAYER_RADIUS) return player;
                }
            }
            return null;
        }

        function getCanvasCoordinates(event) {
            const rect = canvas.getBoundingClientRect();
            let clientX = event.touches ? event.touches[0].clientX : event.clientX;
            let clientY = event.touches ? event.touches[0].clientY : event.clientY;
            return {
                x: (clientX - rect.left) * (CANVAS_WIDTH / rect.width),
                y: (clientY - rect.top) * (CANVAS_HEIGHT / rect.height)
            };
        }

        function handleStart(event) {
            if (state.isPlaying) return;
            const coords = getCanvasCoordinates(event);
            const clickedItem = getClickedItem(coords.x, coords.y);
            if (clickedItem) {
                saveToHistory(); 
                state.draggedItem = clickedItem;
                canvas.classList.remove('cursor-grab');
                canvas.classList.add('cursor-grabbing');
                if (state.draggedItem.id !== BALL_ID) state.playerTrails[state.draggedItem.id] = [];
            }
        }

        function handleMove(event) {
            if (!state.draggedItem || state.isPlaying) return;
            event.preventDefault(); 
            const coords = getCanvasCoordinates(event);
            const radius = state.draggedItem.id === BALL_ID ? BALL_RADIUS : PLAYER_RADIUS;
            
            state.draggedItem.x = Math.max(radius, Math.min(CANVAS_WIDTH - radius, coords.x));
            state.draggedItem.y = Math.max(radius, Math.min(CANVAS_HEIGHT - radius, coords.y));
            
            const id = state.draggedItem.id;
            if (id !== BALL_ID) {
                if (!state.playerTrails[id]) state.playerTrails[id] = [];
                const lastPoint = state.playerTrails[id].length > 0 ? state.playerTrails[id][state.playerTrails[id].length - 1] : null;
                if (!lastPoint || Math.hypot(state.draggedItem.x - lastPoint.x, state.draggedItem.y - lastPoint.y) > 5) {
                    state.playerTrails[id].push({ x: state.draggedItem.x, y: state.draggedItem.y });
                }
                if (state.playerTrails[id].length > TRAIL_LENGTH) state.playerTrails[id].shift(); 
            }
            updateCanvas();
        }

        function handleEnd() {
            if (state.draggedItem) {
                state.draggedItem = null;
                canvas.classList.add('cursor-grab');
                canvas.classList.remove('cursor-grabbing');
                updateCanvas(); 
            }
        }

        // --- Recording & Playback ---
        function updateRecordButton(isRecording) {
            recordText.textContent = isRecording ? 'A Gravar Movimento...' : 'Gravar Movimento';
            recordBtn.classList.toggle('recording-active', isRecording);
        }

        function startRecording() {
            if (state.isPlaying) return;
            state.isRecording = true;
            state.recording = []; 
            state.playHead = 0;
            clearPlayerTrails();
            
            updateRecordButton(true);
            playbackBtn.disabled = true;
            saveBtn.disabled = true;
            undoBtn.disabled = true;
            setStatus('A gravar movimento...');

            state.interval = setInterval(() => {
                if (!state.isRecording) return;
                const positions = state.players.map(p => ({ id: p.id, x: p.x, y: p.y }));
                state.recording.push({ positions: positions });
            }, FRAME_RATE);
        }

        function stopRecording() {
            if (!state.isRecording) return;
            clearInterval(state.interval);
            state.isRecording = false;
            updateRecordButton(false);
            
            const hasFrames = state.recording.length > 0;
            playbackBtn.disabled = !hasFrames;
            saveBtn.disabled = !hasFrames;
            updateCanvas(); 
            setStatus(`Gravação terminada (${state.recording.length} frames). Pronto para guardar no Supabase.`);
        }

        function startPlayback() {
            if (state.isRecording || state.recording.length === 0 || state.isPlaying) return;
            state.isPlaying = true;
            state.playHead = 0;
            clearPlayerTrails();
            recordBtn.disabled = true;
            saveBtn.disabled = true;
            undoBtn.disabled = true; 
            playbackBtn.textContent = 'Parar';

            state.interval = setInterval(() => {
                if (state.playHead >= state.recording.length) {
                    stopPlayback();
                    return;
                }
                const frame = state.recording[state.playHead];
                frame.positions.forEach(pos => {
                    let item = state.players.find(p => p.id === pos.id);
                    if (item) { item.x = pos.x; item.y = pos.y; }
                });
                updateCanvas();
                state.playHead++;
            }, FRAME_RATE);
        }

        function stopPlayback() {
            clearInterval(state.interval);
            state.isPlaying = false;
            recordBtn.disabled = false;
            saveBtn.disabled = state.recording.length === 0;
            playbackBtn.textContent = 'Play';
            
            if (state.recording.length > 0) {
                 const lastFrame = state.recording[state.recording.length - 1];
                 lastFrame.positions.forEach(pos => {
                    let item = state.players.find(p => p.id === pos.id);
                    if (item) { item.x = pos.x; item.y = pos.y; }
                });
            }
            state.playHead = 0;
            updateCanvas(); 
            setStatus('Reprodução terminada.');
        }

        // --- CRUD COMPLETO + Conectores Dinâmicos com Supabase ---

        function setEditState(playId) {
            state.activePlayId = playId;
            currentPlayIdSpan.textContent = playId;
            editingBadge.classList.remove('hidden');
            cancelEditBtn.classList.remove('hidden');
            saveBtn.textContent = '🔄 Atualizar Jogada na BD';
            dbPlaySelect.value = playId;
        }

        function clearEditState() {
            state.activePlayId = null;
            editingBadge.classList.add('hidden');
            cancelEditBtn.classList.add('hidden');
            saveBtn.textContent = '💾 Guardar Jogada';
            dbPlaySelect.value = "";
        }

        // Adicionar novo Tipo e/ou SubTipo manualmente aos seletores
        function handleAddNewCategory() {
            const rawType = newTypeInput.value.trim();
            const rawSubtype = newSubtypeInput.value.trim();

            if (!rawSubtype) {
                setStatus("Introduza pelo menos um SubTipo para adicionar!", true);
                return;
            }

            const targetType = rawType || playTypeSelect.value || 'Ataque';

            if (!SUBTIPOS_MAP[targetType]) {
                SUBTIPOS_MAP[targetType] = [];
            }

            if (!SUBTIPOS_MAP[targetType].includes(rawSubtype)) {
                SUBTIPOS_MAP[targetType].push(rawSubtype);
            }

            // Repopular seletores mantendo o tipo e novo subtipo selecionados
            populatePlayTypesSelect(state.plays);
            playTypeSelect.value = targetType;
            updateSubtypesSelect(rawSubtype);

            newTypeInput.value = '';
            newSubtypeInput.value = '';
            setStatus(`Categoria "${targetType} > ${rawSubtype}" adicionada aos seletores.`);
        }

        // Sincronizar tipos/subtipos existentes na BD no mapa local
        function syncCategoriesFromPlays(plays) {
            plays.forEach(p => {
                if (p.tipo && p.subtipo) {
                    if (!SUBTIPOS_MAP[p.tipo]) {
                        SUBTIPOS_MAP[p.tipo] = [];
                    }
                    if (!SUBTIPOS_MAP[p.tipo].includes(p.subtipo)) {
                        SUBTIPOS_MAP[p.tipo].push(p.subtipo);
                    }
                } else if (p.tipo && !SUBTIPOS_MAP[p.tipo]) {
                    SUBTIPOS_MAP[p.tipo] = [];
                }
            });
        }

        // Preenche dinamicamente o seletor de TIPOS DE JOGADA
        function populatePlayTypesSelect(plays) {
            syncCategoriesFromPlays(plays);
            const currentSelectedValue = playTypeSelect.value;
            const allTypes = Object.keys(SUBTIPOS_MAP);

            playTypeSelect.innerHTML = '';
            
            allTypes.forEach(tipo => {
                const option = document.createElement('option');
                option.value = tipo;
                option.textContent = tipo;
                playTypeSelect.appendChild(option);
            });

            if (currentSelectedValue && allTypes.includes(currentSelectedValue)) {
                playTypeSelect.value = currentSelectedValue;
            } else if (allTypes.length > 0) {
                playTypeSelect.value = allTypes[0];
            }

            updateSubtypesSelect();
        }

        // Preenche dinamicamente o seletor de SUBTIPOS DE JOGADA
        function updateSubtypesSelect(selectedSubtype = null) {
            const selectedType = playTypeSelect.value;
            const subtipos = SUBTIPOS_MAP[selectedType] || [];
            
            playSubtypeSelect.innerHTML = '';
            
            subtipos.forEach(sub => {
                const option = document.createElement('option');
                option.value = sub;
                option.textContent = sub;
                playSubtypeSelect.appendChild(option);
            });

            if (selectedSubtype && subtipos.includes(selectedSubtype)) {
                playSubtypeSelect.value = selectedSubtype;
            }
        }

        // Preenche o <select id="dbPlaySelect"> com a lista de jogadas existentes
        function populateSelectOptions(plays) {
            dbPlaySelect.innerHTML = '<option value="">-- Selecionar Jogada --</option>';
            
            if (plays.length === 0) {
                dbPlaySelect.innerHTML = '<option value="">Sem jogadas na BD</option>';
                return;
            }

            plays.forEach(item => {
                const option = document.createElement('option');
                option.value = item.id;
                const playObj = typeof item.jogada === 'string' ? JSON.parse(item.jogada) : item.jogada;
                const name = playObj?.name || `Jogada #${item.id}`;
                const subStr = item.subtipo ? ` > ${item.subtipo}` : '';
                option.textContent = `[${item.tipo}${subStr}] ${name} (${item.responsavel})`;
                dbPlaySelect.appendChild(option);
            });

            if (state.activePlayId) {
                dbPlaySelect.value = state.activePlayId;
            }
        }

        // CREATE (Insert) & UPDATE (Upsert)
        async function savePlayToSupabase() {
            if (state.recording.length === 0) {
                setStatus("Grave um movimento antes de guardar!", true);
                return;
            }

            const name = playNameInput.value.trim() || `Jogada Sem Nome`;
            const tipo = playTypeSelect.value;
            const subtipo = playSubtypeSelect.value || null;
            const responsavel = playResponsavelInput.value.trim() || 'Treinador';

            if (!tipo) {
                setStatus("Selecione um tipo de jogada válido!", true);
                return;
            }

            const jogadaData = {
                name: name,
                labels: state.playerLabels,
                recording: state.recording
            };

            setStatus("A comunicar com a base de dados...");

            let result;
            const payload = { 
                tipo: tipo, 
                subtipo: subtipo,
                jogada: jogadaData, 
                responsavel: responsavel 
            };

            if (state.activePlayId) {
                result = await supabase
                    .from('jogadas')
                    .update(payload)
                    .eq('id', state.activePlayId)
                    .select();
            } else {
                result = await supabase
                    .from('jogadas')
                    .insert([payload])
                    .select();
            }

            const { data, error } = result;

            if (error) {
                console.error("Erro no Supabase:", error);
                setStatus(`ERRO: ${error.message}`, true);
            } else {
                const msg = state.activePlayId ? `Jogada #${state.activePlayId} atualizada!` : `Jogada "${name}" criada com sucesso!`;
                setStatus(msg);
                clearEditState();
                await loadPlaysFromSupabase();
            }
        }

        // READ (Select All)
        async function loadPlaysFromSupabase() {
            dbPlaySelect.innerHTML = '<option value="">-- A carregar jogadas... --</option>';

            const { data: jogadas, error } = await supabase
                .from('jogadas')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error("Erro ao carregar do Supabase:", error);
                dbPlaySelect.innerHTML = '<option value="">Erro ao carregar jogadas</option>';
                populatePlayTypesSelect([]);
                return;
            }

            state.plays = jogadas || [];
            
            // Atualiza os seletores conectados à BD
            populatePlayTypesSelect(state.plays);
            populateSelectOptions(state.plays);
            renderSavedPlaysList(state.plays);
        }

        // EVENTO: Alterar seleção no <select> de Jogadas
        function handleSelectPlayChange(e) {
            const selectedId = e.target.value;
            if (!selectedId) {
                clearEditState();
                resetPlayersToInitialState();
                return;
            }

            const foundPlay = state.plays.find(p => p.id == selectedId);
            if (foundPlay) {
                loadPlayIntoCanvas(foundPlay);
            }
        }

        // DELETE
        async function deletePlayFromSupabase(id) {
            const confirmed = await showCustomModal(
                'Confirmação',
                `Tem a certeza que deseja apagar a jogada #${id} da base de dados?`,
                true
            );
            
            if (confirmed) {
                setStatus("A eliminar...");
                const { error } = await supabase
                    .from('jogadas')
                    .delete()
                    .eq('id', id);

                if (error) {
                    console.error("Erro ao apagar:", error);
                    setStatus(`Erro ao apagar: ${error.message}`, true);
                } else {
                    setStatus(`Jogada #${id} eliminada.`);
                    if (state.activePlayId === id) clearEditState();
                    await loadPlaysFromSupabase();
                }
            }
        }

        // READ ONE INTO CANVAS
        function loadPlayIntoCanvas(dbPlay) {
            if (state.isPlaying || state.isRecording) {
                showCustomModal('Atenção', 'Pare a reprodução ou gravação antes de carregar uma jogada.', false);
                return;
            }

            const playContent = typeof dbPlay.jogada === 'string' ? JSON.parse(dbPlay.jogada) : dbPlay.jogada;
            state.recording = playContent.recording || [];
            state.history = []; 
            clearPlayerTrails(); 
            
            if (playContent.labels) {
                state.playerLabels = JSON.parse(JSON.stringify(playContent.labels));
                renderPlayerLabelInputs();
            }

            if (state.recording.length > 0) {
                const firstFrame = state.recording[0];
                firstFrame.positions.forEach(pos => {
                    let item = state.players.find(p => p.id === pos.id);
                    if (item) { item.x = pos.x; item.y = pos.y; }
                });
                
                playNameInput.value = playContent.name || 'Jogada';
                
                // Assegurar compatibilidade com tipos/subtipos guardados
                if (dbPlay.tipo) {
                    if (!SUBTIPOS_MAP[dbPlay.tipo]) SUBTIPOS_MAP[dbPlay.tipo] = [];
                    if (dbPlay.subtipo && !SUBTIPOS_MAP[dbPlay.tipo].includes(dbPlay.subtipo)) {
                        SUBTIPOS_MAP[dbPlay.tipo].push(dbPlay.subtipo);
                    }
                    populatePlayTypesSelect(state.plays);
                    playTypeSelect.value = dbPlay.tipo;
                }
                
                updateSubtypesSelect(dbPlay.subtipo);

                playResponsavelInput.value = dbPlay.responsavel || 'Treinador';
                setEditState(dbPlay.id);

                playbackBtn.disabled = false;
                saveBtn.disabled = false; 
                setStatus(`Jogada #${dbPlay.id} ("${playContent.name}") carregada.`);
            }
            updateCanvas();
        }

        // RENDERIZAÇÃO DA LISTA INFERIOR
        function renderSavedPlaysList(plays) {
            const list = document.getElementById('savedPlaysList');
            list.innerHTML = '';
            
            if (!plays || plays.length === 0) {
                list.innerHTML = '<p class="text-gray-500 text-sm">Nenhuma jogada encontrada na BD.</p>';
                return;
            }
            
            plays.forEach(item => {
                const playData = typeof item.jogada === 'string' ? JSON.parse(item.jogada) : item.jogada;
                const div = document.createElement('div');
                div.className = "p-2 bg-white rounded-lg border border-gray-300 shadow-sm flex flex-col gap-1";
                
                const headerDiv = document.createElement('div');
                headerDiv.className = "flex justify-between items-center gap-1";

                const nameSpan = document.createElement('span');
                nameSpan.textContent = playData.name || `Jogada #${item.id}`;
                nameSpan.className = "font-semibold text-gray-800 text-sm truncate";

                const badgeContainer = document.createElement('div');
                badgeContainer.className = "flex gap-1 flex-shrink-0 flex-wrap";

                const typeBadge = document.createElement('span');
                typeBadge.textContent = item.tipo;
                typeBadge.className = "text-xs px-2 py-0.5 bg-teal-100 text-teal-800 rounded-full font-medium";

                badgeContainer.appendChild(typeBadge);

                if (item.subtipo) {
                    const subtypeBadge = document.createElement('span');
                    subtypeBadge.textContent = item.subtipo;
                    subtypeBadge.className = "text-xs px-2 py-0.5 bg-purple-100 text-purple-800 rounded-full font-medium";
                    badgeContainer.appendChild(subtypeBadge);
                }

                headerDiv.appendChild(nameSpan);
                headerDiv.appendChild(badgeContainer);

                const metaDiv = document.createElement('div');
                metaDiv.className = "text-xs text-gray-500 flex justify-between items-center";
                metaDiv.innerHTML = `<span>Resp: ${item.responsavel}</span> <span class="text-gray-400">#${item.id}</span>`;

                const buttonGroup = document.createElement('div');
                buttonGroup.className = "flex space-x-2 mt-1 justify-end";
                
                const loadBtn = document.createElement('button');
                loadBtn.textContent = 'Carregar';
                loadBtn.className = 'text-xs px-2 py-1 bg-teal-500 hover:bg-teal-600 text-white rounded font-semibold';
                loadBtn.onclick = () => loadPlayIntoCanvas(item);
                
                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = 'Apagar';
                deleteBtn.className = 'text-xs px-2 py-1 bg-red-500 hover:bg-red-600 text-white rounded font-semibold';
                deleteBtn.onclick = () => deletePlayFromSupabase(item.id);

                buttonGroup.appendChild(loadBtn);
                buttonGroup.appendChild(deleteBtn);

                div.appendChild(headerDiv);
                div.appendChild(metaDiv);
                div.appendChild(buttonGroup);
                list.appendChild(div);
            });
        }

        // --- Inicialização e Event Listeners ---
        function init() {
            initializeState(); 
            loadPlaysFromSupabase(); 
            
            state.isMenuLeftOpen = false; 
            state.isMenuRightOpen = false; 
            updateLayout(); 
            
            canvas.classList.add('cursor-grab');

            dbPlaySelect.addEventListener('change', handleSelectPlayChange);
            playTypeSelect.addEventListener('change', () => updateSubtypesSelect());
            addNewCategoryBtn.addEventListener('click', handleAddNewCategory);

            recordBtn.addEventListener('click', () => state.isRecording ? stopRecording() : startRecording());
            playbackBtn.addEventListener('click', () => state.isPlaying ? stopPlayback() : startPlayback());
            saveBtn.addEventListener('click', savePlayToSupabase);
            cancelEditBtn.addEventListener('click', clearEditState);
            refreshPlaysBtn.addEventListener('click', loadPlaysFromSupabase);
            
            resetBtn.addEventListener('click', resetPlayersToInitialState);
            undoBtn.addEventListener('click', undoLastMove);
            togglePathArrowsBtn.addEventListener('click', togglePathArrowsVisibility);
            toggleOpponentBtn.addEventListener('click', toggleOpponentVisibility);

            canvas.addEventListener('mousedown', handleStart);
            canvas.addEventListener('mousemove', handleMove);
            document.addEventListener('mouseup', handleEnd); 
            
            canvas.addEventListener('touchstart', handleStart, { passive: false });
            canvas.addEventListener('touchmove', handleMove, { passive: false });
            document.addEventListener('touchend', handleEnd);
            
            menuToggleLeftBtn.addEventListener('click', () => toggleMenu('left'));
            menuToggleRightBtn.addEventListener('click', () => toggleMenu('right'));
            window.addEventListener('resize', updateLayout);

            document.getElementById('appStatus').textContent = "Comunicação com a DB: OK";
        }

        window.onload = init;
    </script>
</body>
</html>
