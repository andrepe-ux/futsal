<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novasemente Juvenis - Simulador Futsal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos personalizados para o campo de futsal */
        #futsalCanvas {
            border: 3px solid #374151;
            /* A cor de fundo será definida no JavaScript (castanho de madeira claro) */
            cursor: grab;
            touch-action: none; 
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }
        #futsalCanvas:active {
            cursor: grabbing;
        }
        /* Estilo para botões de gravação ativos */
        .recording-active {
            animation: pulse-red 1.5s infinite;
        }
        @keyframes pulse-red {
            0%, 100% { background-color: #ef4444; }
            50% { background-color: #dc2626; }
        }
        /* Garantir que o canvas caiba no seu contentor */
        .canvas-container {
            max-width: 100%; 
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen flex flex-col items-center justify-center p-4" style="font-family: 'Inter', sans-serif;">

    <div id="app" class="w-full max-w-7xl bg-white shadow-2xl rounded-xl p-6 md:p-8 border border-gray-200">
        <h1 class="text-3xl font-bold mb-4 text-teal-600 text-center">Novasemente Juvenis</h1>
        <p class="text-center mb-6 text-gray-500">Simulador de Jogadas de Futsal.</p>

        <div id="appStatus" class="text-sm text-center mb-4 p-2 bg-teal-100 text-teal-800 rounded-lg font-semibold">
            Aplicação Pronta.
        </div>
        
        <div class="lg:hidden mb-4">
            <button id="menuToggleBtn" class="w-full py-3 px-4 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl shadow-md transition duration-150 flex items-center justify-center">
                <svg id="menuIcon" class="w-5 h-5 mr-2 transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
                <span id="menuText">Mostrar Menu</span>
            </button>
        </div>

        <div class="flex flex-col lg:flex-row gap-6">
            
            <div id="menuPanel" class="hidden lg:block lg:w-1/3 space-y-4 order-1">
                
                <div class="p-4 bg-gray-100 rounded-xl shadow-inner border border-gray-200">
                    <h2 class="text-xl font-semibold mb-3 border-b border-gray-300 pb-2 text-teal-600">Opções de Campo</h2>
                    <button id="toggleOpponentBtn" class="w-full py-2 px-4 bg-green-600 hover:bg-green-700 text-white rounded-lg font-bold transition duration-150 shadow-md">
                        Mostrar Equipa Oponente
                    </button>
                </div>

                <div class="p-4 bg-gray-100 rounded-xl shadow-inner border border-gray-200">
                    <h2 class="text-xl font-semibold mb-3 border-b border-gray-300 pb-2 text-teal-600">Gravação e Playback</h2>
                    <div class="flex gap-2 mb-4">
                        <button id="recordBtn" class="w-1/2 py-2 px-4 bg-red-500 hover:bg-red-600 text-white rounded-lg font-bold transition duration-150 disabled:opacity-50 shadow-md">
                            <span id="recordText">Gravar</span>
                        </button>
                        <button id="playbackBtn" class="w-1/2 py-2 px-4 bg-blue-500 hover:bg-blue-600 text-white rounded-lg font-bold transition duration-150 disabled:opacity-50 shadow-md" disabled>
                            Play
                        </button>
                    </div>
                    
                    <input type="text" id="playNameInput" placeholder="Nome da Jogada" class="w-full p-2 mb-3 bg-white border border-gray-300 rounded-lg text-sm text-gray-800 focus:border-teal-500 focus:ring-teal-500 shadow-sm" value="Nova Jogada">

                    <button id="saveBtn" class="w-full py-2 px-4 bg-teal-600 hover:bg-teal-700 text-white rounded-lg font-bold transition duration-150 disabled:opacity-50 shadow-md">
                        Guardar Jogada (Exporta JSON e WEBM)
                    </button>
                    <p id="statusMessage" class="mt-3 text-center text-sm font-semibold text-orange-600"></p>
                </div>

                <div class="p-4 bg-gray-100 rounded-xl shadow-inner border border-gray-200">
                    <h2 class="text-xl font-semibold mb-3 border-b border-gray-300 pb-2 text-teal-600">Gestão de Ficheiros</h2>
                    <div class="space-y-2">
                        <label for="importFile" class="block text-sm font-medium text-gray-700">Importar Jogadas (JSON):</label>
                        <input type="file" id="importFile" multiple accept=".json" class="w-full text-sm text-gray-500
                            file:mr-4 file:py-2 file:px-4
                            file:rounded-lg file:border-0
                            file:text-sm file:font-semibold
                            file:bg-blue-500 file:text-white
                            hover:file:bg-blue-600 cursor-pointer shadow-md"
                        >
                        <button id="exportAllBtn" class="w-full py-2 px-4 bg-gray-400 hover:bg-gray-500 text-white rounded-lg font-bold transition duration-150 disabled:opacity-50 shadow-md">
                            Exportar TODAS as Jogadas
                        </button>
                    </div>
                </div>

                <div class="p-4 bg-gray-100 rounded-xl shadow-inner border border-gray-200">
                    <h2 class="text-xl font-semibold mb-3 border-b border-gray-300 pb-2 text-teal-600">Números e Posições</h2>
                    <div id="playerLabelInputs" class="space-y-2">
                        <p class="text-gray-500 text-sm">Carregando inputs...</p>
                    </div>
                </div>

                <div class="p-4 bg-gray-100 rounded-xl shadow-inner border border-gray-200">
                    <h2 class="text-xl font-semibold mb-3 border-b border-gray-300 pb-2 text-teal-600">Jogadas Salvas (Local)</h2>
                    <div id="savedPlaysList" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                        <p class="text-gray-500 text-sm">Nenhuma jogada carregada.</p>
                    </div>
                </div>
            </div>

            <div class="lg:w-2/3 canvas-container bg-gray-200 rounded-xl p-4 shadow-inner order-2">
                <canvas id="futsalCanvas" width="600" height="800" class="rounded-lg max-w-full h-auto"></canvas>
            </div>

        </div>
    </div>
    
    <footer class="mt-8 text-center text-gray-500 text-sm w-full max-w-7xl">
        andrepe@2025
    </footer>
    <div id="customModal" class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-xl p-6 shadow-2xl w-full max-w-sm border border-teal-600 text-gray-900">
            <h3 id="modalTitle" class="text-xl font-bold mb-4 text-teal-600"></h3>
            <p id="modalMessage" class="text-gray-700 mb-6"></p>
            <div class="flex justify-end gap-3">
                <button id="modalCancel" class="px-4 py-2 bg-gray-300 text-gray-800 rounded-lg hover:bg-gray-400 transition hidden">Cancelar</button>
                <button id="modalConfirm" class="px-4 py-2 bg-teal-600 text-white rounded-lg hover:bg-teal-700 font-semibold transition">Confirmar</button>
            </div>
        </div>
    </div>

    <script type="module">
        // --- Constantes ---
        const LOCAL_STORAGE_KEY = 'futsal_plays';
        const PLAYER_COUNT = 5; 
        const OPPONENT_COUNT = 5; 
        const BALL_ID = 11; 
        const PLAYER_RADIUS = 18; 
        const BALL_RADIUS = 15; 
        const FRAME_RATE = 100; // Milissegundos por frame (10 FPS)
        
        const LOGO_URL = 'https://placehold.co/150x150/9CA3AF/FFFFFF?text=NOVAS%2E'; 
        
        const TEAM_COLOR = '#f87171'; // Vermelho Claro 
        const OPPONENT_COLOR = '#10b981'; // Verde

        // Referências ao DOM
        const canvas = document.getElementById('futsalCanvas');
        const ctx = canvas.getContext('2d');
        const recordBtn = document.getElementById('recordBtn');
        const playbackBtn = document.getElementById('playbackBtn');
        const saveBtn = document.getElementById('saveBtn');
        const exportAllBtn = document.getElementById('exportAllBtn'); 
        const importFile = document.getElementById('importFile'); 
        const playNameInput = document.getElementById('playNameInput');
        const toggleOpponentBtn = document.getElementById('toggleOpponentBtn'); 
        
        const menuPanel = document.getElementById('menuPanel');
        const menuToggleBtn = document.getElementById('menuToggleBtn');
        const menuText = document.getElementById('menuText');
        const menuIcon = document.getElementById('menuIcon');

        // Configurações do Canvas
        const CANVAS_WIDTH = canvas.width;
        const CANVAS_HEIGHT = canvas.height;
        
        // Variáveis do Logótipo
        let logoImage = new Image();
        let isLogoLoaded = false;
        
        logoImage.onload = () => {
            isLogoLoaded = true;
            updateCanvas(); 
        };
        logoImage.src = LOGO_URL; 

        let state = {
            plays: [], 
            players: [], 
            ball: {}, 
            playerLabels: {},
            recording: [],
            isRecording: false,
            isPlaying: false,
            playHead: 0,
            interval: null,
            draggedItem: null,
            mediaRecorder: null,
            videoChunks: [],
            videoBlob: null, 
            isMenuOpen: false, 
            showOpponent: false 
        };
        
        // --- Lógica do Menu Toggle ---
        function toggleMenu() {
            state.isMenuOpen = !state.isMenuOpen;
            
            if (state.isMenuOpen) {
                menuPanel.classList.remove('hidden');
                menuText.textContent = 'Ocultar Menu';
                menuIcon.classList.add('rotate-90');
            } else {
                if (window.innerWidth < 1024) { 
                    menuPanel.classList.add('hidden');
                }
                menuText.textContent = 'Mostrar Menu';
                menuIcon.classList.remove('rotate-90');
            }
        }
        
        function checkScreenSize() {
            if (window.innerWidth >= 1024) {
                menuPanel.classList.remove('hidden');
                state.isMenuOpen = true; 
                menuText.textContent = 'Ocultar Menu';
            } else {
                 if (!state.isMenuOpen) {
                    menuPanel.classList.add('hidden');
                    menuText.textContent = 'Mostrar Menu';
                }
            }
        }
        
        // --- Funções Auxiliares de UI (Modal Personalizado e Status) ---
        function showCustomModal(title, message, isConfirm = false) {
            return new Promise(resolve => {
                const modal = document.getElementById('customModal');
                document.getElementById('modalTitle').textContent = title;
                document.getElementById('modalMessage').textContent = message;
                const confirmBtn = document.getElementById('modalConfirm');
                const cancelBtn = document.getElementById('modalCancel');

                confirmBtn.onclick = () => {
                    modal.classList.add('hidden');
                    resolve(true);
                };

                if (isConfirm) {
                    cancelBtn.classList.remove('hidden');
                    cancelBtn.onclick = () => {
                        modal.classList.add('hidden');
                        resolve(false);
                    };
                } else {
                    cancelBtn.classList.add('hidden');
                }

                modal.classList.remove('hidden');
                modal.focus(); 
            });
        }
        
        function setStatus(message, isError = false) {
            const el = document.getElementById('statusMessage');
            el.textContent = message;
            el.className = `mt-3 text-center text-sm font-semibold transition-all ${isError ? 'text-red-500' : 'text-orange-600'}`;
            clearTimeout(el.timer);
            el.timer = setTimeout(() => { el.textContent = ''; }, 10000); 
        }

        // --- Funções de Desenho e Renderização (Campo de Madeira) ---
        function drawCourt() {
            // Fundo do campo (Efeito Madeira - Cor Castanha MAIS CLARA)
            ctx.fillStyle = '#A1887F'; 
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            
            // Adicionar linhas para simular tábuas
            ctx.strokeStyle = '#8D6E63'; 
            ctx.lineWidth = 0.5;
            const plankHeight = 40; 
            for (let y = 0; y < CANVAS_HEIGHT; y += plankHeight) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(CANVAS_WIDTH, y);
                ctx.stroke();
            }
            
            // --- Desenhar Logotipo Watermark ---
            if (isLogoLoaded) {
                const logoSize = 100; 
                ctx.globalAlpha = 0.1; 
                
                const logoX1 = CANVAS_WIDTH / 2 - logoSize / 2;
                const logoY1 = CANVAS_HEIGHT / 8 - logoSize / 2; 
                ctx.drawImage(logoImage, logoX1, logoY1, logoSize, logoSize);
                
                const logoX2 = CANVAS_WIDTH / 2 - logoSize / 2;
                const logoY2 = CANVAS_HEIGHT * 7 / 8 - logoSize / 2; 
                ctx.drawImage(logoImage, logoX2, logoY2, logoSize, logoSize);
                
                ctx.globalAlpha = 1.0; 
            }
            // -----------------------------------------------------------

            // Reset para linhas de campo de futsal
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            
            // Linhas laterais (bordas)
            ctx.strokeRect(1, 1, CANVAS_WIDTH - 2, CANVAS_HEIGHT - 2);
            
            // Linha do meio
            ctx.beginPath();
            ctx.moveTo(0, CANVAS_HEIGHT / 2);
            ctx.lineTo(CANVAS_WIDTH, CANVAS_HEIGHT / 2);
            ctx.stroke();
            
            // Círculo Central
            ctx.beginPath();
            ctx.arc(CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2, 50, 0, Math.PI * 2, false);
            ctx.stroke();
            
            // Áreas de Baliza (Vertical - Arco no topo e em baixo)
            const areaRadius = 80;
            
            // Área de Baliza Superior (Golpe de Baliza)
            ctx.beginPath();
            ctx.arc(CANVAS_WIDTH / 2, 0, areaRadius, 0, Math.PI, false); 
            ctx.stroke();
            
            // Área de Baliza Inferior (Golpe de Baliza)
            ctx.beginPath();
            ctx.arc(CANVAS_WIDTH / 2, CANVAS_HEIGHT, areaRadius, Math.PI, 0, false); 
            ctx.stroke();
            
            // Marcas de Penalidade
            ctx.fillStyle = 'white';
            ctx.beginPath(); 
            ctx.arc(CANVAS_WIDTH / 2, 100, 3, 0, Math.PI * 2, false); 
            ctx.fill();
            
            ctx.beginPath(); 
            ctx.arc(CANVAS_WIDTH / 2, CANVAS_HEIGHT - 100, 3, 0, Math.PI * 2, false); 
            ctx.fill();
        }

        function drawPlayers() {
            // Desenha a Bola
            ctx.fillStyle = 'white'; 
            ctx.beginPath();
            ctx.arc(state.ball.x, state.ball.y, BALL_RADIUS, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#374151';
            ctx.lineWidth = 1;
            ctx.stroke();

            // Desenha os Jogadores
            const playersToDraw = state.players.filter(p => p.id !== BALL_ID);
            
            playersToDraw.forEach(p => {
                let color;
                let isOpponent = p.id >= 6 && p.id <= (PLAYER_COUNT + OPPONENT_COUNT); 

                if (isOpponent && !state.showOpponent) {
                    return; 
                }

                color = isOpponent ? OPPONENT_COLOR : TEAM_COLOR;
                
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, PLAYER_RADIUS, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#374151';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.fillStyle = 'white';
                ctx.font = '12px Inter'; 
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const label = state.playerLabels[p.id] || (isOpponent ? 'A'+(p.id-PLAYER_COUNT) : p.id); 
                ctx.fillText(label, p.x, p.y);
            });
        }

        function updateCanvas() {
            drawCourt();
            drawPlayers();
        }

        function initializeState() {
            // Posições iniciais do NOSSO TIME (Vermelho) - IDs 1 a 5
            const teamPlayers = [
                { id: 1, x: CANVAS_WIDTH / 2, y: CANVAS_HEIGHT - 50, label: 'G.R.' }, 
                { id: 2, x: CANVAS_WIDTH / 2, y: CANVAS_HEIGHT - 180, label: 'Fixo' }, 
                { id: 3, x: CANVAS_WIDTH / 4, y: CANVAS_HEIGHT - 350, label: 'Ala D' },
                { id: 4, x: 3 * CANVAS_WIDTH / 4, y: CANVAS_HEIGHT - 350, label: 'Ala E' },
                { id: 5, x: CANVAS_WIDTH / 2, y: CANVAS_HEIGHT - 550, label: 'Pivô' }
            ];

            // Posições iniciais do TIME OPONENTE (Verde) - IDs 6 a 10
            const opponentPlayers = [
                { id: 6, x: CANVAS_WIDTH / 2, y: 50, label: 'GR A' }, 
                { id: 7, x: CANVAS_WIDTH / 2, y: 180, label: 'Pivô A' }, 
                { id: 8, x: CANVAS_WIDTH / 4, y: 350, label: 'Ala E A' },
                { id: 9, x: 3 * CANVAS_WIDTH / 4, y: 350, label: 'Ala D A' },
                { id: 10, x: CANVAS_WIDTH / 2, y: 550, label: 'Fixo A' }
            ];
            
            state.ball = { id: BALL_ID, x: CANVAS_WIDTH / 2, y: CANVAS_HEIGHT / 2, label: 'Bola' };
            
            state.players = [...teamPlayers, ...opponentPlayers, state.ball]; 
            
            teamPlayers.forEach(p => state.playerLabels[p.id] = p.label);
            opponentPlayers.forEach(p => state.playerLabels[p.id] = p.label);
            state.playerLabels[BALL_ID] = 'Bola';

            renderPlayerLabelInputs();
            updateCanvas();
        }

        function renderPlayerLabelInputs() {
            const container = document.getElementById('playerLabelInputs');
            container.innerHTML = '';
            
            // Renderiza inputs para a nossa equipa (IDs 1 a 5)
            for (let i = 1; i <= PLAYER_COUNT; i++) {
                const div = document.createElement('div');
                div.className = "flex items-center gap-2";
                
                const colorDiv = document.createElement('div');
                colorDiv.className = `w-4 h-4 rounded-full bg-red-500 shadow-sm`;
                
                const input = document.createElement('input');
                input.type = 'text';
                input.id = `label-${i}`;
                input.placeholder = `Nº ${i} ou Posição`;
                input.value = state.playerLabels[i] || i.toString(); 
                input.className = "flex-grow p-2 bg-white border border-gray-300 rounded-lg text-sm text-gray-800 focus:border-teal-500 focus:ring-teal-500 shadow-sm";
                
                input.onchange = (e) => {
                    state.playerLabels[i] = e.target.value.trim() || i.toString();
                    updateCanvas();
                };
                
                div.appendChild(colorDiv);
                div.appendChild(input);
                container.appendChild(div);
            }
            
            // Adicionar secção para Adversários (IDs 6 a 10)
            const h3 = document.createElement('h3');
            h3.className = "text-md font-semibold mt-4 text-green-600";
            h3.textContent = "Equipa Oponente (Verde)";
            container.appendChild(h3);

            for (let i = PLAYER_COUNT + 1; i <= PLAYER_COUNT + OPPONENT_COUNT; i++) {
                const div = document.createElement('div');
                div.className = "flex items-center gap-2";
                
                const colorDiv = document.createElement('div');
                colorDiv.className = `w-4 h-4 rounded-full bg-green-600 shadow-sm`;
                
                const input = document.createElement('input');
                input.type = 'text';
                input.id = `label-${i}`;
                input.placeholder = `Nº Adversário ${i-PLAYER_COUNT}`;
                input.value = state.playerLabels[i] || `A ${i-PLAYER_COUNT}`; 
                input.className = "flex-grow p-2 bg-white border border-gray-300 rounded-lg text-sm text-gray-800 focus:border-teal-500 focus:ring-teal-500 shadow-sm";
                
                input.onchange = (e) => {
                    state.playerLabels[i] = e.target.value.trim() || `A ${i-PLAYER_COUNT}`;
                    updateCanvas();
                };
                
                div.appendChild(colorDiv);
                div.appendChild(input);
                container.appendChild(div);
            }
        }
        
        // --- Lógica de Toggle do Oponente ---
        function toggleOpponentVisibility() {
            state.showOpponent = !state.showOpponent;
            
            if (state.showOpponent) {
                toggleOpponentBtn.textContent = 'Ocultar Equipa Oponente';
                toggleOpponentBtn.classList.remove('bg-green-600', 'hover:bg-green-700');
                toggleOpponentBtn.classList.add('bg-red-500', 'hover:bg-red-600');
            } else {
                toggleOpponentBtn.textContent = 'Mostrar Equipa Oponente';
                toggleOpponentBtn.classList.add('bg-green-600', 'hover:bg-green-700');
                toggleOpponentBtn.classList.remove('bg-red-500', 'hover:bg-red-600');
            }
            updateCanvas();
        }

        // --- Lógica de Drag and Drop (Arrastar e Largar) ---
        
        function getClickedItem(x, y) {
            // Verifica a bola primeiro
            if (Math.hypot(x - state.ball.x, y - state.ball.y) < BALL_RADIUS) {
                return state.ball;
            }

            // Verifica os jogadores
            for (let i = 0; i < state.players.length; i++) {
                const player = state.players[i];
                if (player.id !== BALL_ID) {
                    if (player.id >= 6 && player.id <= 10 && !state.showOpponent) continue; 

                    if (Math.hypot(x - player.x, y - player.y) < PLAYER_RADIUS) {
                        return player;
                    }
                }
            }
            return null;
        }

        function getCanvasCoordinates(event) {
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;

            if (event.touches) {
                clientX = event.touches[0].clientX;
                clientY = event.touches[0].clientY;
            } else {
                clientX = event.clientX;
                clientY = event.clientY;
            }

            const scaleX = CANVAS_WIDTH / rect.width;
            const scaleY = CANVAS_HEIGHT / rect.height;

            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function handleStart(event) {
            if (state.isPlaying) return;
            
            const coords = getCanvasCoordinates(event);
            const clickedItem = getClickedItem(coords.x, coords.y);
            
            if (clickedItem) {
                state.draggedItem = clickedItem;
                canvas.style.cursor = 'grabbing';
            }
        }

        function handleMove(event) {
            if (!state.draggedItem || state.isPlaying) return;
            
            event.preventDefault(); 

            const coords = getCanvasCoordinates(event);
            
            const radius = state.draggedItem.id === BALL_ID ? BALL_RADIUS : PLAYER_RADIUS;
            
            state.draggedItem.x = Math.max(radius, Math.min(CANVAS_WIDTH - radius, coords.x));
            state.draggedItem.y = Math.max(radius, Math.min(CANVAS_HEIGHT - radius, coords.y));
            
            updateCanvas();
        }

        function handleEnd() {
            if (state.draggedItem) {
                state.draggedItem = null;
                canvas.style.cursor = 'grab';
            }
        }
        
        // --- Lógica de Gravação e Reprodução (Com Fallback Aprimorado) ---

        function getMimeType() {
            if (MediaRecorder.isTypeSupported('video/webm; codecs=vp9')) {
                return 'video/webm; codecs=vp9';
            }
            if (MediaRecorder.isTypeSupported('video/webm; codecs=vp8')) {
                return 'video/webm; codecs=vp8';
            }
            if (MediaRecorder.isTypeSupported('video/webm')) {
                return 'video/webm';
            }
            return null;
        }

        function startVideoRecording() {
            state.videoChunks = [];
            state.videoBlob = null;
            state.mediaRecorder = null;
            
            const mimeType = getMimeType();
            if (!mimeType) {
                return false; 
            }

            try {
                // Captura o stream a 10 FPS (1000ms / 100ms)
                const stream = canvas.captureStream(1000 / FRAME_RATE);
                
                state.mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType, bitsPerSecond: 5000000 });
                
                state.mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        state.videoChunks.push(event.data);
                    }
                };
                
                state.mediaRecorder.onerror = (e) => {
                    console.error("MediaRecorder Error:", e);
                    setStatus("ERRO INTERNO NO VÍDEO. A gravar apenas JSON.", true);
                    state.mediaRecorder = null; // Marcar como falha
                }

                state.mediaRecorder.start();
                return true;
                
            } catch (e) {
                console.error("Erro ao iniciar MediaRecorder:", e);
                // Retorna false para indicar que a gravação de vídeo falhou
                return false;
            }
        }
        
        function stopVideoRecording() {
            return new Promise(resolve => {
                if (!state.mediaRecorder || state.mediaRecorder.state === 'inactive') {
                    resolve(null);
                    return;
                }
                
                state.mediaRecorder.onstop = () => {
                    if (state.videoChunks.length > 0) {
                        const blob = new Blob(state.videoChunks, { type: state.mediaRecorder.mimeType });
                        state.videoBlob = blob; 
                        resolve(blob);
                    } else {
                        resolve(null);
                    }
                    state.mediaRecorder = null;
                    state.videoChunks = []; 
                };

                state.mediaRecorder.stop();
            });
        }
        
        function updateRecordButton(isRecording) {
            if (isRecording) {
                recordBtn.textContent = 'A Gravar...';
                recordBtn.classList.remove('bg-red-500', 'hover:bg-red-600');
                recordBtn.classList.add('recording-active');
            } else {
                recordBtn.textContent = 'Gravar';
                recordBtn.classList.add('bg-red-500', 'hover:bg-red-600');
                recordBtn.classList.remove('recording-active');
            }
        }

        function startRecording() {
            if (state.isPlaying) return;
            
            const videoStarted = startVideoRecording();
            
            state.isRecording = true;
            state.recording = []; 
            state.playHead = 0;
            
            updateRecordButton(true);
            playbackBtn.disabled = true;
            saveBtn.disabled = true;
            exportAllBtn.disabled = true; 
            
            if (!videoStarted && getMimeType() === null) {
                 setStatus("AVISO: Gravação de vídeo não suportada neste navegador. A gravar apenas a jogada (JSON).", true);
            } else if (!videoStarted) {
                setStatus("AVISO: Falha ao iniciar gravação de vídeo. A gravar apenas a jogada (JSON).", true);
            } else {
                setStatus('Gravação de movimentos e vídeo iniciada.');
            }

            state.interval = setInterval(() => {
                if (!state.isRecording) return;
                
                const positions = state.players.map(p => ({
                    id: p.id,
                    x: p.x,
                    y: p.y
                }));

                state.recording.push({ positions: positions });
            }, FRAME_RATE);
        }

        async function stopRecording() {
            if (!state.isRecording) return;
            
            clearInterval(state.interval);
            state.isRecording = false;
            
            const videoBlobResult = await stopVideoRecording(); 
            
            updateRecordButton(false);
            
            const hasFrames = state.recording.length > 0;
            playbackBtn.disabled = !hasFrames;
            saveBtn.disabled = !hasFrames;
            exportAllBtn.disabled = false;

            const videoMsg = videoBlobResult ? 'e vídeo (WebM)' : '(vídeo não capturado)';
            setStatus(`Gravação terminada. ${state.recording.length} frames capturados. Pronto para Guardar ${videoMsg}.`);
        }

        function startPlayback() {
            if (state.isRecording || state.recording.length === 0 || state.isPlaying) return;

            state.isPlaying = true;
            state.playHead = 0;
            recordBtn.disabled = true;
            saveBtn.disabled = true;
            exportAllBtn.disabled = true; 
            playbackBtn.textContent = 'Parar';
            playbackBtn.classList.add('bg-orange-500', 'hover:bg-orange-600');
            playbackBtn.classList.remove('bg-blue-500', 'hover:bg-blue-600');
            
            setStatus('A reproduzir jogada...');

            state.interval = setInterval(() => {
                if (state.playHead >= state.recording.length) {
                    stopPlayback();
                    return;
                }
                
                const frame = state.recording[state.playHead];
                
                frame.positions.forEach(pos => {
                    let item = state.players.find(p => p.id === pos.id);
                    if (item) {
                        item.x = pos.x;
                        item.y = pos.y;
                        if (item.id === BALL_ID) {
                            state.ball.x = pos.x;
                            state.ball.y = pos.y;
                        }
                    }
                });
                
                updateCanvas();
                state.playHead++;
            }, FRAME_RATE);
        }

        function stopPlayback() {
            clearInterval(state.interval);
            state.isPlaying = false;
            recordBtn.disabled = false;
            saveBtn.disabled = state.recording.length === 0;
            exportAllBtn.disabled = false; 
            playbackBtn.textContent = 'Play';
            playbackBtn.classList.remove('bg-orange-500', 'hover:bg-orange-600');
            playbackBtn.classList.add('bg-blue-500', 'hover:bg-blue-600');
            
            setStatus('Reprodução terminada.');
        }


        // --- Persistência (Local Storage e Exportação/Importação) ---

        function savePlaysToLocal() {
            try {
                const dataToSave = {
                    plays: state.plays,
                    playerLabels: state.playerLabels
                };
                const data = JSON.stringify(dataToSave);
                localStorage.setItem(LOCAL_STORAGE_KEY, data);
            } catch (e) {
                console.error("Erro ao guardar no Local Storage:", e);
                setStatus("ERRO: Não foi possível guardar os dados localmente.", true);
            }
        }

        function loadPlaysFromLocal() {
            try {
                const data = localStorage.getItem(LOCAL_STORAGE_KEY);
                if (data) {
                    const loadedData = JSON.parse(data);
                    state.plays = loadedData.plays || [];
                    
                    if (loadedData.playerLabels) {
                        Object.assign(state.playerLabels, loadedData.playerLabels);
                        renderPlayerLabelInputs();
                    }
                } else {
                    state.plays = [];
                }
            } catch (e) {
                console.error("Erro ao carregar do Local Storage:", e);
                setStatus("AVISO: Dados de treino corrompidos. A iniciar um novo estado.", true);
                state.plays = [];
            }
        }

        function downloadFile(data, filename, type) {
            let blob;
            if (type === 'application/json') {
                const json = JSON.stringify(data, null, 2);
                blob = new Blob([json], { type: type });
            } else {
                blob = data; 
            }
            
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
        
        function exportSinglePlayJson(playData) {
            const safeName = playData.name.replace(/[^a-z0-9]/gi, '_').toLowerCase();
            const filename = `NJ_JOGADA_JSON_${safeName}_${playData.id}.json`;
            downloadFile(playData, filename, 'application/json');
        }
        
        function exportSinglePlayVideo(playData) {
            if (!state.videoBlob) return false;

            try {
                const safeName = playData.name.replace(/[^a-z0-9]/gi, '_').toLowerCase();
                const filename = `NJ_JOGADA_VIDEO_${safeName}_${playData.id}.webm`;
                downloadFile(state.videoBlob, filename, 'video/webm');
                return true;
            } catch (e) {
                console.error("Erro ao exportar vídeo:", e);
                setStatus("ERRO: O vídeo pode ter falhado ao ser gravado.", true);
                return false;
            }
        }
        
        async function handleSavePlay() {
            if (state.recording.length === 0) {
                setStatus("Comece a gravar antes de tentar guardar!", true);
                return;
            }
            
            const name = playNameInput.value.trim() || `Jogada ${state.plays.length + 1}`;
            
            const newPlay = {
                id: Date.now(),
                name: name,
                labels: state.playerLabels,
                recording: state.recording,
            };
            
            state.plays.push(newPlay);
            savePlaysToLocal(); 
            renderSavedPlaysList(); 
            
            // 1. Exportar o JSON (sempre)
            exportSinglePlayJson(newPlay);
            
            // 2. Exportar o Vídeo (se existir)
            const videoExported = exportSinglePlayVideo(newPlay);

            if (videoExported) {
                setStatus(`JSON e Vídeo WEBM (${newPlay.name}) exportados com sucesso!`);
            } else {
                 setStatus(`Jogada "${name}" guardada e JSON exportado. Vídeo não disponível.`, true);
            }
            
            // Limpar o blob após o download para evitar duplicação em futuros saves
            state.videoBlob = null;
        }
        
        function loadPlay(play) {
            if (state.isPlaying || state.isRecording) {
                showCustomModal('Atenção', 'Pare a reprodução ou gravação antes de carregar uma nova jogada.', false);
                return;
            }
            
            state.recording = play.recording;
            
            Object.assign(state.playerLabels, play.labels);
            renderPlayerLabelInputs();
            
            state.videoBlob = null;

            if (state.recording.length > 0) {
                const firstFrame = state.recording[0];
                firstFrame.positions.forEach(pos => {
                    let item = state.players.find(p => p.id === pos.id);
                    if (item) {
                        item.x = pos.x;
                        item.y = pos.y;
                        if (item.id === BALL_ID) {
                            state.ball.x = pos.x;
                            state.ball.y = pos.y;
                        }
                    }
                });
                playNameInput.value = play.name;
                playbackBtn.disabled = false;
                saveBtn.disabled = false; 
                setStatus(`Jogada "${play.name}" carregada. Pressione Play para reproduzir.`);
            } else {
                playbackBtn.disabled = true;
                saveBtn.disabled = true;
                setStatus(`Jogada "${play.name}" carregada, mas não contém frames de movimento.`, true);
            }
            updateCanvas();
        }

        async function deletePlay(id) {
            const confirmed = await showCustomModal(
                'Confirmação',
                'Tem a certeza que deseja apagar esta jogada? Esta ação não pode ser desfeita.',
                true
            );
            
            if (confirmed) {
                state.plays = state.plays.filter(p => p.id !== id);
                savePlaysToLocal();
                renderSavedPlaysList();
                setStatus('Jogada eliminada.');
            }
        }
        
        function handleImportFiles(event) {
            const files = event.target.files;
            if (files.length === 0) return;

            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const importedData = JSON.parse(e.target.result);
                        
                        if (importedData.recording && importedData.labels) {
                            importedData.id = importedData.id || Date.now();
                            importedData.name = importedData.name || file.name.replace('.json', '');
                            state.plays.push(importedData);
                            setStatus(`Jogada "${importedData.name}" importada com sucesso.`);
                        } else if (importedData.plays) {
                            importedData.plays.forEach(play => {
                                play.id = play.id || Date.now();
                                state.plays.push(play);
                            });
                            setStatus(`${importedData.plays.length} jogadas importadas com sucesso.`);
                        } else {
                            throw new Error("Estrutura de ficheiro JSON inválida.");
                        }

                        savePlaysToLocal();
                        renderSavedPlaysList();
                    } catch (error) {
                        setStatus(`ERRO ao processar o ficheiro ${file.name}: ${error.message}`, true);
                    }
                };
                reader.readAsText(file);
            });
            event.target.value = ''; 
        }
        
        function handleExportAll() {
            if (state.plays.length === 0) {
                setStatus("Nenhuma jogada para exportar.", true);
                return;
            }
            
            const dataToExport = {
                plays: state.plays,
                playerLabels: state.playerLabels,
                exportedAt: new Date().toISOString()
            };
            
            downloadFile(dataToExport, `NJ_EXPORT_ALL_JOGADAS_${Date.now()}.json`, 'application/json');
            setStatus(`Exportadas ${state.plays.length} jogadas para ficheiro JSON.`, false);
        }

        function renderSavedPlaysList() {
            const list = document.getElementById('savedPlaysList');
            list.innerHTML = '';
            
            if (state.plays.length === 0) {
                list.innerHTML = '<p class="text-gray-500 text-sm">Nenhuma jogada salva.</p>';
                return;
            }
            
            state.plays.forEach(play => {
                const div = document.createElement('div');
                div.className = "flex justify-between items-center p-3 bg-white rounded-lg border border-gray-300 shadow-sm transition hover:bg-gray-50";
                
                const nameSpan = document.createElement('span');
                nameSpan.textContent = play.name;
                nameSpan.className = "font-medium text-gray-800 flex-grow truncate mr-2";

                const buttonGroup = document.createElement('div');
                buttonGroup.className = "flex space-x-2";
                
                // Botão de Carregar
                const loadBtn = document.createElement('button');
                loadBtn.textContent = 'Carregar';
                loadBtn.className = 'text-xs px-2 py-1 bg-teal-500 hover:bg-teal-600 text-white rounded-md font-semibold transition';
                loadBtn.onclick = () => loadPlay(play);
                
                // Botão de Exportar
                const exportBtn = document.createElement('button');
                exportBtn.textContent = 'Exportar JSON';
                exportBtn.className = 'text-xs px-2 py-1 bg-gray-500 hover:bg-gray-600 text-white rounded-md transition';
                exportBtn.onclick = () => exportSinglePlayJson(play);
                
                // Botão de Eliminar
                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = 'X';
                deleteBtn.className = 'text-xs w-6 h-6 bg-red-500 hover:bg-red-600 text-white rounded-full transition leading-none';
                deleteBtn.onclick = () => deletePlay(play.id);

                buttonGroup.appendChild(loadBtn);
                buttonGroup.appendChild(exportBtn);
                buttonGroup.appendChild(deleteBtn);

                div.appendChild(nameSpan);
                div.appendChild(buttonGroup);
                list.appendChild(div);
            });
        }

        // --- Inicialização e Listeners ---
        function init() {
            // Verifica se MediaRecorder é suportado e informa o utilizador se não for
            if (typeof MediaRecorder === 'undefined' || !HTMLCanvasElement.prototype.captureStream) {
                setStatus("AVISO: O seu navegador não suporta a gravação de vídeo (WebM). Apenas o JSON será exportado.", true);
            }
            
            initializeState(); 
            loadPlaysFromLocal(); 
            renderSavedPlaysList(); 
            checkScreenSize(); 

            // Listeners de Gravação/Playback
            recordBtn.addEventListener('click', () => state.isRecording ? stopRecording() : startRecording());
            playbackBtn.addEventListener('click', () => state.isPlaying ? stopPlayback() : startPlayback());
            saveBtn.addEventListener('click', handleSavePlay);
            exportAllBtn.addEventListener('click', handleExportAll);
            
            // Listener de Importação
            importFile.addEventListener('change', handleImportFiles);
            
            // Listener de Toggle do Oponente
            toggleOpponentBtn.addEventListener('click', toggleOpponentVisibility);

            // Listeners de Drag & Drop (Mouse e Touch)
            canvas.addEventListener('mousedown', handleStart);
            canvas.addEventListener('mousemove', handleMove);
            document.addEventListener('mouseup', handleEnd); 
            
            canvas.addEventListener('touchstart', handleStart, { passive: false });
            canvas.addEventListener('touchmove', handleMove, { passive: false });
            document.addEventListener('touchend', handleEnd);
            
            // Listener do Menu Toggle (Mobile)
            menuToggleBtn.addEventListener('click', toggleMenu);
            
            // Listener de Redimensionamento do Ecrã
            window.addEventListener('resize', checkScreenSize);

            document.getElementById('appStatus').textContent = "Aplicação totalmente funcional.";
        }

        window.onload = init;
    </script>
</body>
